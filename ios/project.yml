name: Lync
options:
  bundleIdPrefix: com.lync
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"
targets:
  Lync:
    type: application
    platform: iOS
    sources:
      - path: Lync
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: Lync/Lync.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
    info:
      path: Lync/Info.plist
      properties:
        CFBundleDisplayName: Lync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr]
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [Fonts/bricolage.ttf, Fonts/figtree.ttf]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "Lync shows you on the map to your connections only, when you choose to share. Go ghost anytime."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Keep sharing your position with your connections while Lync is in the background. Turn on ghost mode to stop."
        NSCameraUsageDescription: "Scan a classmate's Lync code to connect."
        NSPhotoLibraryUsageDescription: "Choose a photo for your post, story or profile."
        NFCReaderUsageDescription: "Tap phones together to connect on Lync."
        # Lync HCE card (Android) + NFC Forum Type 4 tag application (NDEF stickers)
        com.apple.developer.nfc.readersession.iso7816.select-identifiers: [F04C594E4301, D2760000850101]
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_KEY: $(SUPABASE_KEY)
        LYNC_DEMO: $(LYNC_DEMO)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lync.campus.ios
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8SB6YUB3C6
        ENABLE_PREVIEWS: YES
  LyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LyncTests
    dependencies:
      - target: Lync
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lync.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lync
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Lync:
    build:
      targets:
        Lync: all
    test:
      targets: [LyncTests]
